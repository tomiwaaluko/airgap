# This file is the SOURCE OF TRUTH for the Airgap ticket set.
# Linear mirrors it. If they disagree, this file wins and Linear gets corrected.
#
# Fields:
#   id           stable key, also the branch prefix (air-7-...)
#   title        Linear issue title
#   tier         mechanical | standard | design | safety-critical  (see AGENTS.md §10)
#   depends_on   ticket ids that must be merged first
#   human        true = a person must do this, do not dispatch an agent
#   reads        contract docs the implementer must read before coding
#   body         Linear issue description, verbatim
#
# LINEAR NUMBERING: add 4.
#   Linear's own AIR-1..AIR-4 are its onboarding issues and predate this
#   project; its counter does not rewind. So canonical AIR-n is Linear AIR-(n+4):
#   AIR-1 -> AIR-5, AIR-17 -> AIR-21, AIR-18 -> AIR-22.
#   Every issue title is prefixed with its canonical id and every description
#   states its own mapping, so the canonical id is never inferred from the URL.
#   Ids in THIS file and in all docs are always canonical.
version: 1
project: Airgap
team_key: AIR
linear_workspace: airgap-hardware
linear_id_offset: 4

tickets:

  - id: AIR-1
    title: "Repo scaffold, tooling, and CI"
    tier: mechanical
    depends_on: []
    reads: ["docs/spec/00-overview.md"]
    body: |
      ## Context
      Nothing exists yet except contract documents and one spike. Every other
      ticket assumes `uv sync` and `uv run pytest` work.

      ## Scope
      - `pyproject.toml` with the **complete** dependency set listed in AGENTS.md
        §5. Python 3.14. This list is frozen for the project: later tickets use
        what is declared here rather than adding their own, so the set must
        already include `hypothesis` (property tests in AIR-2 and AIR-11),
        `freezegun` (AGENTS.md §6 forbids `sleep()` in tests) and `rich`
        (AIR-18), plus `hatchling` as the build backend required to install the
        `src/`-layout package from a clean clone. A ticket that has to add one of
        these has found a defect in this ticket, not a reason to edit
        `pyproject.toml` quietly.
      - Package skeleton at `src/airgap/` with `__init__.py` and empty typed stubs
        for the modules named in `docs/spec/00-overview.md`. Stubs raise
        `NotImplementedError`; they exist so imports resolve.
      - `tests/` with a peer file per module, each containing one passing
        placeholder so the suite is green.
      - `ruff` and `mypy` configured strictly. `mypy` in strict mode on `src/`.
      - `tests/test_layering.py`, enforcing two rules:
        1. no module other than `supervisor.py` imports `transport` (invariant 7);
        2. the **pure core** — `protocol.py` and `policy.py` — imports nothing
           internal except `airgap.vocab`, and `vocab.py` imports nothing internal
           at all. See AGENTS.md §5 for why `vocab` is the one permitted edge.
      - CI runs `python scripts/validate_plan.py` alongside lint, types and tests.
        **It must be invoked as bare `python`, not `uv run`** — it is the
        pre-dispatch gate and is standard-library-only by design so that it works
        before this ticket exists. Do not add PyYAML to make it prettier.
      - GitHub Actions workflow running all four on push.
      - `.gitignore` covering `.venv/`, `__pycache__/`, `*.db`, `.env`.

      ## Acceptance criteria
      - `uv sync` succeeds from a clean clone.
      - `uv run pytest`, `uv run ruff check .`, `uv run mypy src/` all exit 0.
      - `python scripts/validate_plan.py` exits 0 and is wired into CI.
      - `tests/test_layering.py` fails if you temporarily add
        `import airgap.transport` to `broker.py` (try it, then revert).
      - It also fails if you add `import airgap.transport` to `policy.py`, and
        **passes** with `import airgap.vocab` there. Demonstrate both.

      ## Verification
      `uv sync && uv run ruff check . && uv run mypy src/ && uv run pytest && python scripts/validate_plan.py`

  - id: AIR-2
    title: "Serial protocol codec"
    tier: standard
    depends_on: [AIR-16]
    reads: ["docs/spec/01-serial-protocol.md"]
    body: |
      ## Context
      The wire contract is frozen. This is the pure, I/O-free implementation of
      it that both the bridge and the tests build on.

      ## Scope
      - Typed command and event models in `src/airgap/protocol.py` (pydantic or
        dataclasses, your call — justify in the PR).
      - `encode(cmd) -> bytes` — trailing `\n`, ASCII, raises `FrameTooLong`
        above 200 bytes.
      - `decode(line: bytes) -> Ack | Event | None` — returns `None` on anything
        unparseable. Never raises.
      - Monotonic id allocator that wraps 65535 -> 1.

      ## Acceptance criteria
      - Every command and event shape in the spec round-trips.
      - Property test: `decode(encode(c))` preserves all fields, for generated
        valid `c` (use `hypothesis`).
      - Fuzz test: `decode()` returns `None` and does not raise for 1000 random
        byte strings including truncated JSON, embedded nulls, and non-UTF-8.
      - `lcd` truncation to 16 chars happens here, host-side, per the spec.
      - **Command names, error codes and event names come from `airgap.vocab`.
        Do not redeclare them here** — a second definition is the exact drift
        AIR-16 exists to prevent (`PLAN.md` P1).
      - `airgap.vocab` is the **only** internal import permitted, and there is no
        I/O. `tests/test_layering.py` enforces both. This is the pure-core rule
        in AGENTS.md §5; the vocab edge is deliberate, not a loophole.

      ## Verification
      `uv run pytest tests/test_protocol.py -v`

      ## Out of scope
      Serial port handling. That is AIR-3.

  - id: AIR-3
    title: "Transport layer: MockTransport and SerialTransport"
    tier: standard
    depends_on: [AIR-2]
    reads: ["docs/spec/01-serial-protocol.md"]
    body: |
      ## Context
      Almost all development happens with no Arduino attached. `MockTransport` is
      what makes that possible, so it is the more important half of this ticket.

      ## Scope
      - One `Transport` protocol/ABC: `write(frame: bytes)`, async
        `read_lines() -> AsyncIterator[bytes]`, `close()`, `connected: bool`.
      - `SerialTransport` over `pyserial`, 115200 8N1, non-blocking line assembly
        with a 200-byte buffer that discards and counts overflows.
      - `MockTransport` that records written frames and replays a scripted
        sequence of device lines, including the 1 Hz `tick` stream. It must be
        able to simulate: normal operation, tick starvation, garbage bytes,
        a mid-stream `boot` event, and disconnection.
      - Ack correlation: match acks to command ids, surface a 100 ms timeout.

      ## Acceptance criteria
      - `MockTransport` can drive every scenario listed above from a test.
      - Line assembly is correct across chunk boundaries: a frame split into three
        arbitrary reads still decodes once.
      - Buffer overflow discards exactly the overlong line and recovers on the next.
      - No test in this ticket requires physical hardware.

      ## Verification
      `uv run pytest tests/test_transport.py -v`

  - id: AIR-4
    title: "Arduino firmware: command interpreter"
    tier: design
    depends_on: [AIR-16]
    reads: ["docs/spec/04-firmware.md", "docs/spec/01-serial-protocol.md"]
    body: |
      ## Context
      One sketch, flashed once, never reflashed mid-demo. It implements the device
      side of the protocol and nothing else. The pin map is frozen and the timer
      reasoning behind it is in the spec — read that section before moving a pin.

      ## Scope
      - `firmware/airgap/airgap.ino` implementing the full command set, the ack
        contract, button events with the armed `req` echo, and the 1 Hz tick.
      - Boot sequence exactly as specified: relay LOW first, then flag up, LED red.
      - Non-blocking throughout. No `delay()` anywhere. Main loop under 5 ms.
      - 25 ms button debounce via `millis()`.
      - Dial low-pass filtered, mapped 0..1023 -> 0..10 with ±1 raw-step hysteresis.
      - **Relay lease, two commands**: `relay(closed=true)` closes and starts a
        10 000 ms lease; `relay_renew` extends it ONLY if already closed and acks
        `not_closed` otherwise. They are separate commands on purpose -- merging
        them was the v1.1 deadlock (review 02 C1). On expiry the device opens the
        contact itself and emits `lease_expired`.
      - `tick` reports `lease_ms` and `btns` (3-bit held-button field).
      - **Held-button suppression**: on `arm`, record which buttons are held and
        suppress their events until released and pressed again.
      - `README.md` in `firmware/` with the wiring table and how to flash.

      ## Acceptance criteria
      - Compiles for Arduino UNO with `arduino-cli compile --fqbn arduino:avr:uno`.
      - Every command in the spec is handled; unknown commands ack with
        `{"ok":false,"err":"unknown_cmd"}`.
      - Button events while disarmed carry `"req":null`.
      - Relay lease expires at 10 s without renewal, opens the contact, and emits
        `lease_expired`. Verifiable in simulation or on hardware in AIR-5.
      - `relay_renew` on an open contact acks `not_closed` and does NOT close it.
      - A button held across an `arm` emits no event until released and re-pressed.
      - Boot drives the flag UP (blocked) and the relay open, always.
      - No `delay()` call anywhere in the sketch (grep it in the PR).

      ## Verification
      `arduino-cli compile --fqbn arduino:avr:uno firmware/airgap`

      ## Out of scope
      Running it on real hardware — that is AIR-5, a human task.

  - id: AIR-5
    title: "Hardware bring-up on the physical device"
    tier: standard
    human: true
    depends_on: [AIR-4]
    reads: ["docs/spec/04-firmware.md"]
    body: |
      ## Context
      **This ticket requires a person, an Arduino, and a breadboard. Do not
      dispatch an agent to it.**

      ## Scope
      Wire the device per the pin map and work through the bring-up checklist in
      `docs/spec/04-firmware.md`, recording the result of each step.

      ## Acceptance criteria
      All eight checklist items pass, especially these two, which are different
      failures with different mechanisms — passing one says nothing about the other:
      - **item 6:** unplug the USB cable while the relay is closed. The contact
        must open. If it does not, the wiring is inverted and every safety claim
        downstream is void — stop and fix the wiring before closing this ticket.
      - **item 7:** kill the host process with USB still connected and the relay
        closed. The contact must open within 10 s via lease expiry.

      ## Verification
      Checklist results pasted into the ticket, plus a photo of the wired board.

  - id: AIR-6
    title: "Supervisor core: validation, clamps, rate limits, fail-safe"
    tier: safety-critical
    depends_on: [AIR-3]
    reads: ["docs/spec/02-supervisor.md"]
    body: |
      ## Context
      This is the module that makes "the model cannot write to the device" a
      structural fact. It is the highest-risk code in the project. Enumerate the
      failure modes before you implement, and adversarially review your own work
      before opening the PR.

      ## Scope
      Implement `src/airgap/supervisor.py` to the frozen contract: the typed
      command allowlist, the value clamps, the four rate limits, the tick
      watchdog, and the safe-state transition.

      **The relay interlock is NOT in this ticket.** Rules 4, 4a, 4b and 4c --
      arming, verdict minting, the relay cycle, the dwell, lease renewal and
      `lease_expired` scoping -- are AIR-17. This ticket provides the validated
      `send()` that AIR-17 builds on. Leave a clearly-named seam for it; do not
      stub the interlock in a way AIR-17 has to unpick.

      ## Acceptance criteria
      Exactly the list under **"`tests/test_supervisor.py` -- Rules 1, 2, 3, 5,
      6"** at the foot of `docs/spec/02-supervisor.md`. That document splits its
      test obligations by ticket; **you are scored against your list and not
      against AIR-17's.** Each failure mode tested **independently**:
      - all clamp boundaries (`n=0`, `n=1`, `n=5`, `n=6`)
      - `led.state` outside the four-value enum is rejected, not coerced
      - `lcd` truncation to 16 chars and non-ASCII stripping
      - `arm.req` not matching the 8-hex pattern is rejected
      - each of the four rate limits at its boundary
      - `relay` commands are **rejected, never silently dropped**, on rate limit
      - 3001 ms of tick starvation enters the safe state
      - three consecutive unparseable lines enter the safe state
      - safe state resolves pending requests with verdict `link_lost`, NOT
        `denied` with a reason string (review 01 finding I3)
      - `relay(closed=False)` succeeds in every state, including the safe state
      - **only typed Command objects are accepted** -- no dict, no string, no
        raw passthrough, no escape hatch

      ## Out of scope
      Rules 4, 4a, 4b, 4c and everything about the relay cycle. That is AIR-17.

      ## Verification
      `uv run pytest tests/test_supervisor.py -v` and paste the full test list.

  - id: AIR-7
    title: "Data model and migrations"
    tier: standard
    depends_on: [AIR-16]
    reads: ["docs/spec/05-data-model.md"]
    body: |
      ## Context
      Four tables, frozen schema. The audit table has an unusual constraint: it
      must be append-only at the database level, not merely by convention.

      ## Scope
      - SQLAlchemy 2.x models in `src/airgap/models.py` for `requests`,
        `warden_assessments`, `audit_log`, `policies`.
      - Alembic migration creating all four, with the specified indexes.
      - A Postgres rule or trigger that rejects UPDATE and DELETE on `audit_log`.
      - Session factory and a `get_session()` dependency for FastAPI.

      ## Acceptance criteria
      - Migration applies cleanly to an empty Postgres and downgrades cleanly.
      - A test asserts that UPDATE and DELETE against `audit_log` both raise.
      - Column names and types match the spec exactly.

      ## Verification
      `uv run alembic upgrade head && uv run pytest tests/test_models.py -v`

  - id: AIR-8
    title: "Audit log with verifiable hash chain"
    tier: safety-critical
    depends_on: [AIR-7]
    reads: ["docs/spec/05-data-model.md"]
    body: |
      ## Context
      The audit chain is what makes the log tamper-evident. Its canonical-JSON
      function is load-bearing: if a future refactor changes serialisation, every
      hash after that point silently stops verifying.

      ## Scope
      - `src/airgap/audit.py`: `append(event, request_id, payload)` and
        `verify_chain(from_seq=0) -> tuple[bool, int | None]`.
      - Canonical JSON: sorted keys, no whitespace, UTF-8.
      - Genesis row hashes against 64 zeros.

      ## Acceptance criteria
      - A **pinned known-good vector**: a fixed input whose expected hash is
        hardcoded in the test. This is what protects against silent serialisation
        drift — do not compute it from the implementation.
      - `verify_chain` returns `(True, None)` for a healthy chain.
      - Mutating any field of any row (via raw SQL, bypassing the trigger) makes
        `verify_chain` return that row's seq.
      - Key ordering in `payload` does not affect the hash.

      ## Verification
      `uv run pytest tests/test_audit.py -v`

  - id: AIR-9
    title: "Broker: blocking approval core"
    tier: design
    depends_on: [AIR-17, AIR-11]
    reads: ["docs/spec/03-broker-api.md", "spikes/01-blocking-tool-call/FINDINGS.md"]
    body: |
      ## Context
      The blocking call is the whole product. It was verified against a real MCP
      client before this was specced — read the spike findings so you understand
      what is already known to work and do not redesign it into handle-and-poll.

      ## Scope
      - FastAPI app in `src/airgap/broker.py` with `/request_approval`,
        `/pending`, `/health`, and the read routes. **There is no `/decide`
        endpoint** -- every verdict is produced in-process.
      - **Three token scopes**, per `docs/spec/03-broker-api.md`: `agent`
        (`POST /request_approval` only), `ui` (reads + `PUT /policies/{pattern}`),
        and `ui_ro` (reads only, no write route at all, rejects `Origin`). A
        `ui_ro` token presented to `PUT /policies/{pattern}` gets `403` -- the
        capability is absent from the scope, not merely unused.
      - Requests park on an `asyncio.Event`. Exactly one armed at a time; others
        queue FIFO with their callers still blocked.
      - **Mint the per-arm short code, and drive the LCD from the risk class.**
        This is the T1 control in `DESIGN.md` §4.2/§9/§13 and until now no ticket
        produced it -- AIR-18 asserts it matches, and nothing generated it.
        - On each `arm`, generate a fresh short code: a **per-arm nonce**, not a
          prefix of `request_id` and not derived from it. Re-arming the same
          request produces a **different** code. That is the whole point: a stale
          row in a reader must not be able to match a live request.
        - Low/medium risk: LCD shows the action, as today.
        - **High risk: the LCD must never show a truncatable identifier.** It
          shows the short code and `SEE READER`. The copy names the *role* and
          not any particular surface, because at M2 the dashboard does not exist
          yet and the terminal reader does.
        - The code is exposed on the `ui`/`ui_ro` read routes so a reader can
          display it alongside the full action.
      - 30-minute configurable expiry resolving to `expired`, relay open.
      - Startup recovery: disarm, open relay, mark stale pending rows `link_lost`.
      - Every state change written to the audit log **before** it is acted on.

      ## Acceptance criteria
      - A request blocks until resolved, then returns the verdict.
      - **There is NO `/decide` endpoint.** Enumerate every route the broker
        exposes and assert none of them resolves a request, for ANY `decided_by`
        value including `policy` and `system`. Review 01 made the endpoint reject
        `human`; review 02 (I4) showed that was half a fix, because a co-resident
        agent holding the MCP token could still post `decided_by=policy` and
        unblock a consent-channel call. The endpoint is gone, not hardened. This
        is the single most important assertion in this ticket.
      - **Token scopes**: `agent` reaches only `POST /request_approval`; `ui`
        reaches reads and policy edits; `ui_ro` reaches reads only. Assert that
        **no scope reaches another's routes** -- all six directions, not just the
        `agent`/`ui` pair -- and specifically that `ui_ro` gets `403` from
        `PUT /policies/{pattern}`.
      - Broker binds 127.0.0.1. **`Origin` handling keys on the presented token
        scope, never on the route.** `agent` and `ui_ro` reject any request
        carrying `Origin`; `ui` allowlists it, because the dashboard is a browser
        and does send one.

        This distinction is load-bearing and easy to get backwards. `GET /pending`
        is reachable by **both** `ui` and `ui_ro`, so "`ui_ro` routes reject
        `Origin`" is not a well-defined rule -- implemented literally it rejects
        the dashboard's own read of the queue, which is design review 02's
        blanket-`Origin` break replayed on the shared read path. One route, two
        behaviours, chosen by the credential. See `docs/spec/03-broker-api.md`.
      - **High-risk requests never put a truncatable identifier on the LCD.**
        Assert it directly: a request with a long, near-colliding `tool_args`
        classified `high` produces LCD copy containing the short code and no
        prefix of the argument. This is `DESIGN.md` §13's T1 obligation.
      - Re-arming a request mints a **different** short code than the first arm.
      - Audit rows are written **before** callers are released and before the
        relay moves. Assert the ordering, not merely that both occurred.
      - Two concurrent requests: the second stays blocked while the first is
        armed, and arms only after the first resolves plus the 2 s dead time.
      - Expiry resolves to verdict `expired` — not `denied`.
      - Tick starvation resolves pending requests to verdict `link_lost` — not
        `denied` with a reason.
      - Killing and restarting the broker marks pending rows `link_lost`; no
        approval survives a restart.
      - Inbound rate limit: 6/min per tool_name per actor, then reject. Verify a
        retry flood cannot grow the queue.

      ## Verification
      `uv run pytest tests/test_broker.py -v`

  - id: AIR-10
    title: "MCP server exposing request_approval"
    tier: standard
    depends_on: [AIR-9]
    reads: ["docs/spec/03-broker-api.md"]
    body: |
      ## Context
      The public face of the system. Exactly one tool. The tool description is
      load-bearing — it is the only thing telling an actor agent to call this
      *before* acting rather than after — so use it verbatim from the spec.

      ## Scope
      - `src/airgap/mcp_server.py` using `MCPServer` from `mcp.server.mcpserver`.
        Note: the `mcp` package is v2.x; `mcp.server.fastmcp` no longer exists.
      - Both stdio and streamable-http transports, selected by CLI flag.
      - No client-side timeout on the call to the broker.

      ## Acceptance criteria
      - `list_tools` returns exactly one tool with the schema from the spec.
      - An in-process client gets `APPROVED: ...` / `DENIED: ...` text back.
      - A call held open for 150 s returns correctly on both transports — the
        spike harness already demonstrates the pattern, reuse its shape.

      ## Verification
      `uv run pytest tests/test_mcp_server.py -v`

  - id: AIR-11
    title: "Deterministic policy engine"
    tier: safety-critical
    depends_on: [AIR-7]
    reads: ["docs/spec/05-data-model.md"]
    body: |
      ## Context
      The policy engine runs **after** the Warden and can only narrow its verdict.
      This asymmetry is the safety property: a compromised or jailbroken Warden
      cannot widen its own authority.

      ## Scope
      - `src/airgap/policy.py`, pure, no I/O, no LLM calls.
      - Glob matching of `tool_pattern` against tool names.
      - `resolve(warden_verdict, policy_action, dial) -> Verdict` implementing the
        resolution table in the spec exactly.
      - The dial: escalate to human when `dial >= policy.min_dial`.

      ## Acceptance criteria
      - Every cell of the resolution table has its own test.
      - **Unmatched tool defaults the POLICY ACTION to `escalate`**, then the
        resolution table applies. NOT "the verdict is escalate" -- a Warden
        `block` on an unmatched tool must stay `block`, or you have widened a deny
        and broken invariant 4 (review 02 finding I1). Test that cell explicitly.
      - **A `relay_gated` row forces `auto_approve -> escalate` in the RESOLVER**,
        before a verdict exists. Do not try to get this from the interlock: a
        missing interlock branch stops the contact closing but leaves the verdict
        `approved`, which means a lamp that reports success while staying dark
        (review 02 finding I3, DESIGN.md D12).
      - Property test: for all inputs, `resolve()` never returns a verdict more
        permissive than the Warden's. Assert this as an invariant, not a case.
      - Turning the dial up never makes an outcome more permissive.
      - `airgap.vocab` is the **only** internal import permitted, and there is no
        I/O. `Verdict`, `decided_by` and the policy action names come **from
        `vocab.py`**; declaring them inline here is the drift AIR-16 exists to
        stop. This is the pure-core rule as stated in AGENTS.md §5 and `PLAN.md`
        P1 -- an earlier draft of this ticket said "no imports from elsewhere in
        `airgap`", which contradicted it.

      ## Verification
      `uv run pytest tests/test_policy.py -v`

  - id: AIR-12
    title: "Warden triage agent"
    tier: design
    depends_on: [AIR-11]
    reads: ["docs/spec/00-overview.md", "docs/spec/05-data-model.md"]
    body: |
      ## Context
      An LLM that classifies risk and proposes a verdict. It has read-only tools.
      It must not be able to reach the transport, the relay, or the policy engine's
      output. Treat its response as a proposal, never an instruction.

      ## Scope
      - `src/airgap/warden.py` using the Anthropic Messages API with tool use.
      - Read-only tools: `classify_risk`, `check_policy`, `search_decision_history`,
        `read_autonomy_dial`.
      - **No injection-screening tool.** v1.1 had `check_injection_signature`;
        `DESIGN.md` T2 demoted LLM-side injection screening from a control to
        "not a control" — an LLM asked whether text is malicious is subject to
        the same text. Shipping the tool anyway would advertise a defence the
        design explicitly withdrew, and the next reader would count on it.
        Injection is contained by the Warden's output being a *proposal* the
        policy engine can only narrow, which is a structural bound rather than a
        judgment call.
      - Writes a `warden_assessments` row for every request it sees.
      - Structured output; a malformed or missing response falls back to
        `escalate`, never to `auto_approve`.

      ## Acceptance criteria
      - Tests use a stubbed LLM client; no live API calls in the suite.
      - A response that fails to parse yields `escalate`.
      - An LLM response of `auto_approve` on a tool the policy blocks still
        results in `block` end to end.
      - The Warden has no import path to `transport` or `supervisor`
        (`tests/test_layering.py` should cover this once extended).
      - Prompt-injection strings in `justification` do not change the verdict —
        include a handful of adversarial fixtures.

      ## Verification
      `uv run pytest tests/test_warden.py -v`

  - id: AIR-13
    title: "Dashboard: live queue, audit trail, policy editor"
    tier: standard
    depends_on: [AIR-9]
    reads: ["docs/spec/03-broker-api.md", "docs/spec/05-data-model.md"]
    body: |
      ## Context
      This is what a judge or a recruiter actually looks at. It should make the
      blocking visible: a pending request with a running timer is the whole story.

      ## Scope
      - Next.js app in `web/`.
      - Live pending queue over WebSocket or SSE, with elapsed-time counters.
      - Audit trail with chain-verification status shown per row.
      - Policy editor over the `policies` table.
      - Link health indicator driven by `/health`.

      ## Acceptance criteria
      - **The dashboard has NO approve control.** No button, no route, no API
        call, no token scope that can resolve a request. Approval happens on the
        device and nowhere else — adding a convenient approve button here would
        reintroduce exactly the software approval path that invariant 8 exists to
        remove. A test must assert no dashboard-reachable route resolves a
        request.
      - The policy editor warns clearly when an edit **widens** authority
        (anything → `auto_approve`), and every edit is written to the audit log
        with who made it. Widening is software-writable and that is a known
        limitation (DESIGN.md N-T8) — make it visible rather than quiet.
      - **A restrictive Content-Security-Policy is set and tested.** `PLAN.md` §6
        requires it and this ticket previously never mentioned it. The dashboard
        is the browser reader, and design review 02 finding I7 accepted it as
        *new attack surface inside Z2* specifically because XSS there is a T1
        bypass -- a rendered request could misrepresent what the human is about
        to approve. Default-src `'self'`; no `unsafe-inline`, no `unsafe-eval`,
        no remote script origin. Assert the header is present on every response,
        and include a hostile fixture: `tool_args` and `justification` containing
        markup and a script tag must render as **text**, never as elements.
      - Queue updates within 1 s of a request arriving, no manual refresh.
      - A failed chain verification is visually unmistakable.
      - Readable at 1280x800 (projector resolution) — this gets demoed.

      ## Verification
      `cd web && npm run build && npm run lint`

  - id: AIR-14
    title: "End-to-end integration test against MockTransport"
    tier: design
    depends_on: [AIR-10, AIR-12, AIR-18]
    reads: ["docs/spec/00-overview.md"]
    body: |
      ## Context
      The first test that exercises the whole chain: MCP client through broker,
      warden, policy, supervisor, to a scripted device and back.

      ## Scope
      `tests/test_e2e.py` covering the full path with `MockTransport` and a
      stubbed LLM. No hardware, no live API.

      ## Acceptance criteria
      Each of these end to end. **Scenario order matters**: the first one is the
      one everybody copies when adding the nineteenth, so it must model the
      common case, not the exotic one.
      - **consent-channel happy path (the default shape):** request -> escalate ->
        scripted approve button -> tool call returns APPROVED, and **no relay
        command is sent at all**. Most actions are consent channel (`DESIGN.md`
        §4.4, D12); a `DROP TABLE` does not close a contact. Assert the absence
        of the relay command, do not merely omit it
      - deny path: relay never closes, tool returns DENIED
      - policy block overrides a Warden auto-approve
      - **empty policy table**: every request escalates; nothing auto-approves
      - **relay-gated action with policy auto_approve still escalates** (D12) and
        the relay never closes without a press
      - **no HTTP route resolves a request**, for any `decided_by` value -- the
        software approve path must be closed end to end, not just at unit level
      - **broker killed with the link up while the relay is closed**: the contact
        opens within 10 s via lease expiry and `lease_expired` is audited
      - **relay-gated happy path**: approve -> close -> renew past 10 s -> dwell
        expiry -> open -> disarm. The MCP caller is released at the verdict, not
        at dwell end
      - **empty policy table with a Warden `block`** still resolves `block`
      - a `relay_gated` row set to `auto_approve` resolves `escalate`
      - device reset mid-request resolves `denied` / `device_reset`, never approved
      - link loss mid-request resolves to verdict `link_lost`, relay open
      - **high-risk readability (`DESIGN.md` §13's T1 obligation)**: a `high`-risk
        request with a long, near-colliding argument -- `users_production` against
        `users_prod_bak` -- puts **no truncatable identifier** on the LCD, shows
        the short code and `SEE READER`, and the reader carries the full
        untruncated action. `PLAN.md` §5 justifies this ticket's dependency on
        AIR-18 as "the reader is how high-risk scenarios are asserted"; this is
        that assertion
      - **re-arming mints a fresh short code**: a stale reader row from the first
        arm does not match the second, so it cannot be mistaken for live
      - a button event with a mismatched `req` does not close the relay and the
        request stays pending
      - a second button press inside the 2 s arming dead time binds to nothing
      - the audit chain verifies after every scenario, and every audit row
        precedes the action it records

      ## Verification
      `uv run pytest tests/test_e2e.py -v`

  - id: AIR-15
    title: "Demo runbook and seed data"
    tier: mechanical
    depends_on: [AIR-14, AIR-5]
    reads: ["docs/spec/00-overview.md"]
    body: |
      ## Context
      A demo that fails on stage because Postgres wasn't running is a preventable
      loss. This ticket makes the demo a script, not a memory exercise.

      ## Scope
      - `docs/DEMO.md`: exact steps, in order, with the 60-second script.
      - `scripts/seed_demo.py`: policies and a plausible decision history so
        `search_decision_history` has something to find.
      - `scripts/preflight.py`: checks Postgres, the serial port, the relay, and
        the LED/servo, then prints a green or red summary.
      - A recorded fallback video in case the hardware dies on stage.

      ## Acceptance criteria
      - `preflight.py` exits non-zero with a clear message if the device is absent.
      - A cold machine can go from clone to working demo following DEMO.md alone.

      ## Verification
      `uv run python scripts/preflight.py`

  - id: AIR-16
    title: "Vocabulary single-source and spec lint"
    tier: design
    depends_on: [AIR-1]
    reads: ["docs/PLAN.md", "docs/spec/01-serial-protocol.md", "docs/spec/02-supervisor.md", "docs/spec/05-data-model.md"]
    body: |
      ## Context
      Two design reviews found the same class of defect repeatedly: the same word
      meaning different things in different files. `denied` vs `link_lost`,
      `ALWAYS-DENY` vs `never`, three vs four LED states, `expired` as a verdict
      vs as a reason. Every one was documentation-only and every one would have
      become a code bug. `PLAN.md` P1 calls this the dominant failure mode.

      This ticket makes that class impossible to introduce silently. It runs
      second, before any behaviour is written, because drift is cheapest to
      prevent at time zero.

      ## Scope
      - `src/airgap/vocab.py`: the single definition of every closed vocabulary --
        command names, ack error codes, event names, LED states, tone patterns,
        verdicts, `decided_by` values, audit event names, policy actions. Python
        StrEnum. Nothing else in the codebase may define these inline.
      - `tests/test_spec_lint.py`: parses the markdown tables and fenced JSON in
        `docs/spec/01-serial-protocol.md`, **`docs/spec/02-supervisor.md`** and
        `docs/spec/05-data-model.md`, extracts the vocabularies, and asserts
        **set equality in both directions** against `vocab.py`. A term in the
        spec but not the code fails. A term in the code but not the spec also
        fails -- one-way checking is how dead vocabulary accumulates.

        **`spec/02` is not optional coverage, it is the point.** It is where the
        drift has actually happened twice: it miscounted the command list while
        `spec/01` listed nine, and its test obligations contradicted its own
        Rules 4b and 4c. A lint whose coverage map excludes the document that
        drifts is decoration. Check at least: the command count and names, the
        verdict names, and the `decided_by` values.
      - `tests/test_no_stale_refs.py`: asserts no **implementation** reintroduces
        a removed concept. Scope it to `src/` and `tests/`, plus one structural
        assertion that `docs/spec/03-broker-api.md` declares no route table row
        for the term. Seed it with `/decide`, removed in v1.2.

        **Scope it that way deliberately.** The obvious version -- "fail if the
        string appears in any non-review doc" -- fails on the frozen contracts,
        `AGENTS.md` and this plan, all of which name `/decide` in order to say it
        is gone. Since §10 forbids an agent editing `docs/spec/`, that lint would
        be unfixable from inside the ticket and wave 2 could never merge. Prose
        explaining a removal is the documentation working; a route in `src/` is
        the regression. Lint the second.
      - Wire both into CI.

      ## Acceptance criteria
      - Adding a command to the `spec/01` table without adding it to `vocab.py`
        fails the lint. **Demonstrate it**: make the edit, show the failure,
        revert. Use `spec/01`, which is the safe one to touch transiently -- do
        not demonstrate against `spec/02`.
      - Changing `spec/02`'s "the nine commands" to "eight" fails the lint. This
        is a real historical defect; the lint must catch it.
      - Removing a verdict from `vocab.py` that `spec/05` still lists fails.
      - Adding a term to `vocab.py` absent from the specs also fails.
      - Adding `@app.post("/decide")` to `src/airgap/broker.py` fails.
      - A markdown sentence stating that `/decide` was removed does **not** fail.
      - Failure output names the term and both locations, not just "sets differ".

      ## Out of scope
      Linting prose, pin numbers, or anything that is not a closed vocabulary.
      Keep the parser boring: a clever markdown parser that breaks whenever a
      table is edited is worse than no lint at all.

      ## Verification
      `uv run pytest tests/test_spec_lint.py tests/test_no_stale_refs.py -v`

  - id: AIR-17
    title: "Relay interlock and cycle: Rules 4, 4a, 4b, 4c"
    tier: safety-critical
    depends_on: [AIR-6, AIR-8]
    reads: ["docs/spec/02-supervisor.md", "docs/DESIGN.md", "docs/reviews/2026-08-23-design-review-02.md"]
    body: |
      ## Context
      **This is the highest-risk ticket in the project.** Both design reviews
      found their Critical defects here, and review 02 found one that review 01's
      own fix had introduced. Read
      `docs/reviews/2026-08-23-design-review-02.md` before writing anything -- it
      documents a deadlock a careful reader would otherwise reproduce.

      The single most important thing to understand: **`relay` closes and
      `relay_renew` holds, and they are separate commands on purpose.** `relay` is
      Rule-4-gated. `relay_renew` is not, because it acks `not_closed` on an open
      contact and therefore cannot create a closure -- only extend one that an
      authorised close already made. v1.1 merged them and made the contact
      impossible to close after an approval.

      ## Scope
      - The arming state machine. **ARMED is Supervisor state, not a database
        query**, and it survives the request's resolution -- released only after
        the contact reopens.
      - Rule 4: the five-condition interlock on `relay(closed=true)`.
      - Rule 4a: a passing interlock mints `decided_by=human` in-process and
        writes the audit row **before** anything moves.
      - Rule 4b: the cycle -- close once, release the caller, renew at 3 s, dwell
        out (`policies.dwell_s`, default 60 s), open, disarm, observe `btns == 0`,
        2 s dead time, next arm.
      - Rule 4c: `lease_expired` scoped to the armed request.

      ## Acceptance criteria
      Exactly the list under **"`tests/test_interlock.py` -- Rules 4, 4a, 4b,
      4c"** at the foot of `docs/spec/02-supervisor.md`, reproduced here. Each
      tested independently; a happy-path test is not coverage.

      Note that spec/02 v1.1 fixed that list. Before v1.1 it demanded renewal
      stop on resolution and `lease_expired` deny pending requests -- both of
      which Rules 4b and 4c forbid. **If you are working from a cached copy that
      still says either thing, stop and escalate (§10); do not implement it.**
      - each of the five interlock conditions failing **on its own**
      - **resolve-then-close succeeds** -- condition 1 passes after the request is
        resolved, because the Supervisor is still ARMED. This is the v1.1
        deadlock; without this test the ticket is not done
      - a mismatched `req` never closes the relay
      - a button event while disarmed never closes the relay
      - a replayed button event closes the relay **at most once**
      - a button held across `arm` is suppressed and cannot approve
      - `relay_renew` is accepted while closed, rejected `not_closed` while open,
        and can never close an open contact
      - the full cycle asserts **in order**, not merely that each step happened
      - renewal continues after the verdict is returned; it stops on dwell expiry,
        explicit open, safe state or disarm -- **never on verdict**
      - a consent-channel (non-`relay_gated`) request sends **no relay command**
      - **an auto-approved request never closes the relay, however policy is
        configured.** This is a *different* test from the one above and `spec/02`
        requires both: `relay_gated` is a policy bit, `auto_approve` is a verdict,
        and D12 needs the pair. Configure the row `relay_gated = true` **and**
        `auto_approve` -- the combination that would close a contact with no human
        present if Rule 4 were written in terms of verdicts instead of button
        events. Assert the mechanism: an auto-approved request produces no button
        event, so condition 2 can never be satisfied. Do not settle for observing
        that the contact stayed open
      - the audit row precedes the relay close -- assert the ordering
      - `lease_expired` while armed mid-dwell does not change the verdict
      - `lease_expired` while unarmed touches no queued request
      - the 2 s dead time and `btns == 0` both hold before the next arm

      ## Verification
      `uv run pytest tests/test_interlock.py -v` and paste the full test list.

  - id: AIR-18
    title: "airgap watch: full-fidelity terminal reader"
    tier: standard
    depends_on: [AIR-9]
    reads: ["docs/PLAN.md", "docs/DESIGN.md", "docs/spec/03-broker-api.md"]
    body: |
      ## Context
      A 16x2 LCD cannot distinguish `users_production` from `users_prod_bak`, so
      a high-risk request must be read somewhere full-fidelity before approval.
      Routing that through a browser puts template rendering and XSS on the T1
      path (review 02 finding I7). A terminal reader gives the same fidelity with
      materially less attack surface, and keeps a Next.js app off the MVP
      critical path (`PLAN.md` section 4.3).

      ## Scope
      - `airgap watch` console entry point. Long-running, holds a **`ui_ro`**
        token and reads `GET /pending`, `/audit`, `/policies`.

        **Not `ui`.** The `ui` scope may `PUT /policies/{pattern}`, and this is a
        long-running local process whose environment a co-resident agent can
        often read. A reader holding a policy-write token hands N-T8 to the actor
        (`spec/03` token scopes, `DESIGN.md` §11).
      - Shows the pending request in full: actor, tool name, **complete**
        `tool_args`, justification, Warden risk class and reasoning, the policy
        row matched, dial level, elapsed time, and the short code on the LCD.
      - Updates within 1 s of a request arriving.
      - Renders untrusted strings safely: escape control characters, no ANSI
        passthrough from `tool_args` or `justification`. **Assume the actor
        controls those strings and is hostile.**
      - Shows link health and queue depth.

      ## Acceptance criteria
      - The short code shown matches the armed request's per-arm nonce, so a stale
        view cannot be mistaken for a live one.
      - `tool_args` is shown complete and never truncated. If it does not fit it
        scrolls; it does not elide.
      - An ANSI escape or control character in `justification` cannot move the
        cursor, clear the screen, or alter any other field. Test with a hostile
        fixture.
      - **No approve capability**: no keybinding, no route, no token scope that
        resolves a request. Approval is physical, always.
      - Works with a `ui_ro` token; the `agent` token is rejected.
      - **The reader issues no non-GET request, ever.** Assert it at the HTTP
        client layer, not by inspection -- a test that drives the full reader and
        fails on any method other than `GET`.
      - Presenting the reader's own token to `PUT /policies/{pattern}` returns
        `403`. The capability is absent from the token, not merely unused by the
        code.

      ## Verification
      `uv run pytest tests/test_watch.py -v`
