name: CI

on:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy src/
      - run: uv run pytest tests/test_spec_lint.py tests/test_no_stale_refs.py -v
      - run: uv run pytest
      - run: python scripts/validate_plan.py
