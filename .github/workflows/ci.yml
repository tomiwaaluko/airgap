name: CI

on:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: airgap
          POSTGRES_USER: airgap
          POSTGRES_PASSWORD: airgap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U airgap -d airgap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+pg8000://airgap:airgap@localhost:5432/airgap
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy src/
      - run: uv run pytest tests/test_spec_lint.py tests/test_no_stale_refs.py -v
      - run: uv run pytest
      - run: python scripts/validate_plan.py
